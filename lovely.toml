[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "conf.lua"
pattern = '''function love.conf(t)'''
position = "after"
payload = '''
    pcall(function()
        local ffi = require("ffi")
        ffi.cdef[[
            int SDL_SetHint(const char *name, const char *value);
            int SDL_SetHintWithPriority(const char *name, const char *value, int priority);
        ]]
        local function set_hint(lib)
            local ok, ret = pcall(function()
                return lib.SDL_SetHintWithPriority("SDL_IME_SHOW_UI", "1", 2)
            end)
            if ok and ret ~= 0 then return true end
            ok, ret = pcall(function()
                return lib.SDL_SetHint("SDL_IME_SHOW_UI", "1")
            end)
            return ok and ret ~= 0
        end
        if set_hint(ffi.C) then return end
        for _, lib_name in ipairs({ "SDL2", "SDL2.dll" }) do
            local loaded, lib = pcall(ffi.load, lib_name)
            if loaded and set_hint(lib) then return end
        end
    end)
'''
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''    self:init_window()'''
position = "before"
payload = '''
    pcall(function()
        local ffi = require("ffi")
        ffi.cdef[[
            int SDL_SetHint(const char *name, const char *value);
            int SDL_SetHintWithPriority(const char *name, const char *value, int priority);
        ]]
        local function set_hint(lib)
            local ok, ret = pcall(function()
                return lib.SDL_SetHintWithPriority("SDL_IME_SHOW_UI", "1", 2)
            end)
            if ok and ret ~= 0 then return true end
            ok, ret = pcall(function()
                return lib.SDL_SetHint("SDL_IME_SHOW_UI", "1")
            end)
            return ok and ret ~= 0
        end
        if set_hint(ffi.C) then return end
        for _, lib_name in ipairs({ "SDL2", "SDL2.dll" }) do
            local loaded, lib = pcall(ffi.load, lib_name)
            if loaded and set_hint(lib) then return end
        end
    end)
'''
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''    function love.errorhandler(msg)'''
position = "after"
payload = '''
        pcall(function()
            if _G.tmj_cleanup_restart_text_input then
                _G.tmj_cleanup_restart_text_input()
            end
        end)
'''
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''local function doRestart()
    if SMODS and SMODS.restart_game then
        SMODS.restart_game()
    else
        local test, msg = pcall(function()
            require"lovely".reload_patches()
        end)
        if not test then sendErrorMessage("Failed to reload patches... " .. tostring(msg), "StackTrace") end
        love.event.quit("restart")
    end
end'''
position = "at"
payload = '''
local function doRestart()
    pcall(function()
        if _G.tmj_cleanup_restart_text_input then
            _G.tmj_cleanup_restart_text_input()
        end
    end)
    love.event.quit("restart")
end
'''
match_indent = true
overwrite = false

